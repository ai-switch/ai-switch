name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    outputs:
      release_notes: ${{ steps.notes.outputs.body }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)(\.[0-9]+)?)?$ ]]; then
            echo "Unsupported release tag format: ${GITHUB_REF_NAME}"
            exit 1
          fi
          package_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$package_version" != "$tauri_version" ]]; then
            echo "package.json version ${package_version} does not match Tauri version ${tauri_version}."
            exit 1
          fi
          if [[ "$tag_version" != "$tauri_version" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match app version v${tauri_version}."
            exit 1
          fi

      - name: Check tag commit belongs to default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          if ! git merge-base --is-ancestor "$tag_commit" "origin/$DEFAULT_BRANCH"; then
            echo "Tag ${GITHUB_REF_NAME} is not based on ${DEFAULT_BRANCH}."
            exit 1
          fi

      - name: Collect release notes from the tag commit
        id: notes
        shell: bash
        run: |
          # The bilingual changelog is the tag commit's message (see the release
          # rules in AGENTS.md). GitHub's generated notes are not a substitute:
          # for a release tag they only produce a compare link, which is what the
          # updater manifest used to ship as its entire release notes.
          git log -1 --format=%B "$GITHUB_SHA" > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "Tag commit ${GITHUB_SHA} has an empty message; release notes would be blank." >&2
            exit 1
          fi
          delimiter="release-notes-$(openssl rand -hex 8)"
          {
            echo "body<<${delimiter}"
            cat release-notes.md
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Create draft release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          name: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          allowUpdates: true
          bodyFile: release-notes.md

  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every row names the triple its artifacts are built for — the host
          # triple on native rows — so binary paths, bundle dirs and asset
          # naming derive from one field with no host/cross branching. See
          # "Compute platform variables".
          - label: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - label: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: "app dmg"
          # An arm64 dmg does not run on an Intel Mac at all — not even under
          # Rosetta — so the second macOS row is the whole of Intel support.
          # It cross-compiles x86_64-apple-darwin on the same Apple Silicon
          # image as the arm64 row (the lingyun/codeg-plus setup), because
          # `macos-15-intel` — the last x86_64 macOS image GitHub offers,
          # available until August 2027 — is going away, and GitHub's arm64
          # images ship no Rosetta for x64 test binaries to run under. Tests
          # in this job therefore run on the arm64 host and the cross build
          # only proves the x64 target compiles and links; the artifacts get
          # one native exercise later, when package-managers.yml installs the
          # cask on a real Intel runner (macos-15-intel is kept for that job).
          - label: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: "app dmg"
          - label: Linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: "deb appimage"

    env:
      CI: true
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate updater signing secret
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "TAURI_SIGNING_PRIVATE_KEY is required for signed updater release assets."
          }

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            gcc-aarch64-linux-gnu

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # The std for the row's triple: the cross rows (macOS Intel) cannot
          # compile without it; on native rows it is the host std already.
          targets: ${{ matrix.target }}

      # 缓存 Rust 编译产物（registry + target/）：首次全量编译后，后续发布仅重编改动部分。
      # key 按 matrix.os + matrix.target 隔离，避免各平台 job 互相覆盖彼此的
      # target 缓存（rust-cache 默认键不含 OS/target；两个 macOS 行现在共用
      # macos-latest 镜像，但各自编译不同的 triple）。
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"
          key: ${{ matrix.os }}-${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute platform variables
        shell: pwsh
        run: |
          # The matrix target triple is the single source of truth: on a cross
          # row (macOS Intel builds x86_64 on an arm64 runner) the runner's own
          # OS/arch would name the wrong updater platform and look for the
          # wrong binaries.
          $targetTriple = "${{ matrix.target }}"

          $exeSuffix = ""
          if ($targetTriple.Contains("windows")) {
            $exeSuffix = ".exe"
          }

          $arch = switch -Wildcard ($targetTriple) {
            "x86_64-*" { "x86_64" }
            "aarch64-*" { "aarch64" }
            default { throw "Unsupported target triple: $targetTriple" }
          }

          $os = switch -Wildcard ($targetTriple) {
            "*-apple-darwin" { "darwin" }
            "*-pc-windows-msvc" { "windows" }
            "*-unknown-linux-gnu" { "linux" }
            default { throw "Unsupported target triple: $targetTriple" }
          }

          # Cargo puts cross builds under target/<triple>/, so the paths below
          # hold for native rows too (where the triple is the host's).
          "TARGET_TRIPLE=$targetTriple" >> $env:GITHUB_ENV
          "EXE_SUFFIX=$exeSuffix" >> $env:GITHUB_ENV
          "UPDATER_PLATFORM=$os-$arch" >> $env:GITHUB_ENV
          "APP_VERSION=$("${{ github.ref_name }}" -replace '^v', '')" >> $env:GITHUB_ENV
          "SERVER_BIN=src-tauri/target/$targetTriple/release/ai-switch-server$exeSuffix" >> $env:GITHUB_ENV
          "BUNDLE_DIR=src-tauri/target/$targetTriple/release/bundle" >> $env:GITHUB_ENV

          if ($os -eq "linux") {
            "SERVER_ARM64_BIN=src-tauri/target/aarch64-unknown-linux-gnu/release/ai-switch-server" >> $env:GITHUB_ENV
          }

      # One command per step on purpose. A Windows runner runs these under pwsh,
      # whose exit code is the *last* command's, so `pnpm test:run` failing used
      # to be swallowed by the successful `pnpm release:manifest:test` after it
      # and the job went green. Splitting keeps the platform's default shell,
      # which is bash with `-e` elsewhere, and leaves each command as the last
      # one in its step — the only shape both shells report correctly.
      - name: Typecheck frontend
        run: pnpm typecheck

      - name: Run frontend tests
        run: pnpm test:run

      - name: Test release manifest
        run: pnpm release:manifest:test

      - name: Build frontend assets
        run: pnpm build

      - name: Check standalone server
        run: pnpm server:check

      - name: Check Rust code
        run: pnpm rust:check

      - name: Run Rust tests
        run: pnpm rust:test

      - name: Build Tauri bundle
        shell: pwsh
        run: |
          $bundles = "${{ matrix.bundles }}".Split(" ", [System.StringSplitOptions]::RemoveEmptyEntries)
          # --target also steers the bundler: the bundle lands under
          # target/<triple>/release/bundle, which "Stage release assets" reads
          # via BUNDLE_DIR.
          & pnpm tauri build --ci --bundles @bundles --target ${{ matrix.target }}

      - name: Patch AppImage for Wayland compatibility
        if: runner.os == 'Linux'
        shell: bash
        env:
          TAURI_BUNDLE_DIR: ${{ env.BUNDLE_DIR }}
        run: bash src-tauri/scripts/patch-appimage-wayland.sh

      - name: Build standalone server
        # CARGO_BUILD_TARGET (not a script edit) sends `cargo build` to the
        # matrix triple, so the server lands in target/<triple>/release where
        # SERVER_BIN looks — same mechanism `tauri build --target` uses above.
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: pnpm server:build:release

      - name: Build Linux ARM64 standalone server
        if: runner.os == 'Linux'
        shell: bash
        run: |
          rustup target add aarch64-unknown-linux-gnu
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
          export AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar
          cd src-tauri
          cargo build --release --target aarch64-unknown-linux-gnu \
            --no-default-features --features standalone-server \
            --bin ai-switch-server

      - name: Stage release assets
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $dest = "release-assets/$env:UPDATER_PLATFORM"
          New-Item -ItemType Directory -Force $dest | Out-Null

          # GitHub sorts the release page's asset list by name and folds all but
          # the first few away, so the installers are named to sort ahead of
          # the server archive. See scripts/stage-release-assets.mjs.
          node scripts/stage-release-assets.mjs `
            --bundle-dir $env:BUNDLE_DIR `
            --dest $dest `
            --platform $env:UPDATER_PLATFORM `
            --version $env:APP_VERSION
          if ($LASTEXITCODE -ne 0) {
            throw "Staging the Tauri bundle assets failed."
          }

          function Stage-ServerArchive {
            param(
              [string] $ServerBin,
              [string] $Platform,
              [bool] $IncludeLinuxHelpers
            )
            $serverStage = "server-bundle-$Platform"
            if (Test-Path $serverStage) { Remove-Item -Recurse -Force $serverStage }
            New-Item -ItemType Directory -Force $serverStage | Out-Null
            New-Item -ItemType Directory -Force "release-assets/$Platform" | Out-Null
            Copy-Item $ServerBin (Join-Path $serverStage (Split-Path $ServerBin -Leaf))
            Copy-Item dist (Join-Path $serverStage "web") -Recurse
            if (-not (Test-Path (Join-Path $serverStage "web/index.html"))) {
              throw "Server bundle is missing web/index.html"
            }
            if ($IncludeLinuxHelpers) {
              Copy-Item scripts/install-server.sh (Join-Path $serverStage "install-server.sh")
              Copy-Item deploy/ai-switch-server.service (Join-Path $serverStage "ai-switch-server.service")
            }
            $serverArchive = Join-Path "release-assets/$Platform" "ai-switch-server_${tag}_${Platform}.zip"
            Compress-Archive -Path "$serverStage/*" -DestinationPath $serverArchive -Force
          }

          Stage-ServerArchive `
            -ServerBin $env:SERVER_BIN `
            -Platform $env:UPDATER_PLATFORM `
            -IncludeLinuxHelpers ("${{ matrix.label }}" -eq "Linux")

          if ("${{ matrix.label }}" -eq "Linux") {
            Stage-ServerArchive `
              -ServerBin $env:SERVER_ARM64_BIN `
              -Platform "linux-aarch64" `
              -IncludeLinuxHelpers $true
          }

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.UPDATER_PLATFORM }}
          path: release-assets/**
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build

    # actions: write is what the package-manager handoff at the end of this job
    # needs; the workflow-level default only grants contents: write.
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Restore release notes
        env:
          RELEASE_NOTES: ${{ needs.prepare.outputs.release_notes }}
        shell: bash
        run: |
          printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "The prepare job produced no release notes for ${GITHUB_REF_NAME}." >&2
            exit 1
          fi

      - name: Generate updater manifest
        run: |
          node scripts/create-updater-manifest.mjs \
            --assets-dir release-assets \
            --tag "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --output release-assets/latest.json \
            --notes-file release-notes.md

      - name: Verify updater signature keys
        run: node scripts/verify-updater-signatures.mjs --manifest release-assets/latest.json --tauri-config src-tauri/tauri.conf.json

      - name: Drop the signature files from the asset list
        shell: bash
        run: |
          # latest.json now carries every signature inline, and that manifest is
          # the only thing that reads them: the updater never fetches a sibling
          # .sig URL. Publishing them anyway only spends the handful of asset
          # rows GitHub shows before it folds the rest away.
          find release-assets -name '*.sig' -delete

      - name: Build the release body
        run: |
          node scripts/create-release-body.mjs \
            --assets-dir release-assets \
            --tag "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --output release-body.md \
            --notes-file release-notes.md

      - name: Create or update release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          allowUpdates: true
          bodyFile: release-body.md
          replacesArtifacts: true
          artifactErrorsFailBuild: true
          artifacts: "release-assets/**/*.*"

      - name: Publish the beta manifest
        # Stable releases do not touch beta. The opt-in client compares both
        # feeds so testers still receive a newer stable release after the RC.
        if: contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node scripts/publish-beta-manifest.mjs \
            --manifest release-assets/latest.json \
            --tag "$GITHUB_REF_NAME"

      - name: Hand the release to the package managers
        # package-managers.yml also listens for `release: published`, but that
        # event never fires for a release published here: GitHub does not start
        # workflow runs from events its own GITHUB_TOKEN created, and
        # ncipollo/release-action publishes with exactly that token. v0.8.1 went
        # out with no package-manager run at all as a result. workflow_dispatch is
        # one of the two documented exceptions to that rule, so the handoff is
        # made explicitly rather than left to the event.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # Dispatched against the tag, so the manifests are rendered by the same
          # commit that produced the assets. A handoff that cannot be dispatched
          # must not turn an already published release red — the whole reason the
          # package managers live in their own workflow — so it warns and the run
          # can be repeated by hand with the same tag input.
          if ! gh workflow run package-managers.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TAG" \
            -f tag="$TAG"; then
            echo "::warning::Could not dispatch package-managers.yml for ${TAG}. Run that workflow by hand with tag=${TAG}."
          fi

      - name: Dispatch the Docker publication
        # Same handoff, same reason. Docker Hub is a third-party registry that can
        # reject a well-formed push (a read-only token, a namespace the token's
        # account has no write access to), and that verdict must never turn an
        # already published release red. A hand-run keeps working because the
        # workflow takes the tag as an input.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh workflow run docker.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TAG" \
            -f tag="$TAG"; then
            echo "::warning::Could not dispatch docker.yml for ${TAG}. Run that workflow by hand with tag=${TAG}."
          fi
