name: APLG Packages

on:
  pull_request:
  push:
    branches: [main]
    tags: ["tauri-plugin-runtime-v*"]

permissions:
  contents: read

concurrency:
  group: aplg-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.12.4

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            pnpm --dir packages/tauri-plugin-devkit exec playwright install --with-deps chromium webkit
          else
            pnpm --dir packages/tauri-plugin-devkit exec playwright install chromium webkit
          fi

      # One command per step on purpose, same reason as in release.yml: this
      # matrix includes windows-latest, where a `run:` without a `shell:` goes
      # through pwsh and the step's exit code is the *last* command's — so a
      # failing `typecheck` was swallowed by the successful `build` after it and
      # the gate reported green. Splitting keeps each platform's default shell
      # and leaves every command as the last one in its step, which is the only
      # shape both bash (`-e`) and pwsh report correctly.
      - name: Runtime typecheck
        run: pnpm --dir packages/tauri-plugin-runtime typecheck

      - name: Runtime tests
        run: pnpm --dir packages/tauri-plugin-runtime test

      - name: Runtime build
        run: pnpm --dir packages/tauri-plugin-runtime build

      - name: Devkit typecheck
        run: pnpm --dir packages/tauri-plugin-devkit typecheck

      - name: Devkit tests
        run: pnpm --dir packages/tauri-plugin-devkit test

      - name: Devkit type tests
        run: pnpm --dir packages/tauri-plugin-devkit run test:types

      - name: Devkit browser type tests
        run: pnpm --dir packages/tauri-plugin-devkit run test:types:browser

      - name: Devkit built tests
        run: pnpm --dir packages/tauri-plugin-devkit run test:built

      - name: Devkit node types check
        run: pnpm --dir packages/tauri-plugin-devkit run check:node-types

      - name: Devkit build
        run: pnpm --dir packages/tauri-plugin-devkit run build

      - name: Browser tests
        if: matrix.os == 'ubuntu-latest'
        run: pnpm --dir packages/tauri-plugin-devkit run test:browser

      - name: External tarball verification
        run: pnpm --dir packages/tauri-plugin-devkit run verify:tarball

      - name: Package release plan
        run: node --test scripts/aplg/plan-release.test.mjs scripts/aplg/publish-npm.test.mjs scripts/aplg/release-metadata.test.mjs

      - name: Pack both packages
        shell: bash
        run: |
          mkdir -p artifacts
          pnpm --dir packages/tauri-plugin-runtime pack --pack-destination "$PWD/artifacts"
          pnpm --dir packages/tauri-plugin-devkit pack --pack-destination "$PWD/artifacts"

      - name: Verify pair
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        shell: bash
        run: |
          runtime="$(find artifacts -name 'ai-switch-tauri-plugin-runtime-*.tgz' -print -quit)"
          devkit="$(find artifacts -name 'ai-switch-tauri-plugin-devkit-*.tgz' -print -quit)"
          node scripts/aplg/verify-pair.mjs --runtime "$runtime" --devkit "$devkit"

  publish:
    name: Publish npm packages
    if: startsWith(github.ref, 'refs/tags/tauri-plugin-runtime-v')
    needs: verify
    runs-on: ubuntu-latest
    environment: aplg-npm-release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is on main
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch origin "$DEFAULT_BRANCH"
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          git merge-base --is-ancestor "$tag_commit" "origin/$DEFAULT_BRANCH"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.12.4

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Pin the supported npm CLI
        run: npm install --global npm@11.6.2

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --dir packages/tauri-plugin-devkit exec playwright install --with-deps chromium webkit

      - name: Build and pack both packages
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir packages/tauri-plugin-runtime build
          pnpm --dir packages/tauri-plugin-devkit build
          mkdir -p artifacts
          pnpm --dir packages/tauri-plugin-runtime pack --pack-destination "$PWD/artifacts"
          pnpm --dir packages/tauri-plugin-devkit pack --pack-destination "$PWD/artifacts"
          runtime="$(find artifacts -name 'ai-switch-tauri-plugin-runtime-*.tgz' -print -quit)"
          devkit="$(find artifacts -name 'ai-switch-tauri-plugin-devkit-*.tgz' -print -quit)"
          node scripts/aplg/verify-pair.mjs --runtime "$runtime" --devkit "$devkit"
          sha256sum artifacts/*.tgz > artifacts/SHA256SUMS

      - name: Publish both packages to npm
        shell: bash
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          runtime="$(find artifacts -name 'ai-switch-tauri-plugin-runtime-*.tgz' -print -quit)"
          devkit="$(find artifacts -name 'ai-switch-tauri-plugin-devkit-*.tgz' -print -quit)"
          node scripts/aplg/publish-npm.mjs \
            --runtime "$runtime" \
            --devkit "$devkit" \
            --tag "$GITHUB_REF_NAME" \
            --source-sha "$GITHUB_SHA" \
            --execute

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aplg-package-release-assets
          path: artifacts
          if-no-files-found: error